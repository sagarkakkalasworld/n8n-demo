name: CI

on:
  push:
    branches:
      - main
workflow_dispatch:      

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Node Version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install

        run: npm install

      - name: Intentional Failure

        run: exit 1
